<style>
        .map-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .map-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pulse-ring {
            animation: map-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes map-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        /* Tactile button layering */
        .node-completed {
            box-shadow: 0 4px 0 0 #5d3fd3; /* primary-container */
        }
        .node-active {
            box-shadow: 0 4px 0 0 #00743a; /* on-secondary-container */
            transform: translateY(-2px);
        }
        .node-locked {
            box-shadow: 0 4px 0 0 #c9c4d7; /* outline-variant */
        }
    </style>
<style>

<script>
        // Auto-scroll to the active node on load
        document.addEventListener('DOMContentLoaded', () => {
            const mapContainer = document.getElementById('map-container');
            // Scroll to near the bottom where level 12 is (25% from bottom)
            // Container is 1500px, viewport is likely ~600-800px.
            // 25% from bottom is roughly 1500 * 0.75 = 1125px down.
            mapContainer.scrollTo({
                top: 1000,
                behavior: 'smooth'
            });
        });
