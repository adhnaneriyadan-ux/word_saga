<!-- Suppression Logic: Suppressed because this is a Task-Focused "Game Screen" -->
<script>
        // Micro-interaction for keyboard
        document.querySelectorAll('.keyboard-key').forEach(key => {
            key.addEventListener('click', () => {
                // Haptic simulation if supported
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });

        // Simple Countdown Timer Logic
        let seconds = 90;
        const timerElement = document.querySelector('.tabular-nums');

        const countdown = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "00:00";
                timerElement.classList.remove('animate-pulse-timer');
                timerElement.classList.add('text-error');
            } else {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (seconds <= 10) {
                    timerElement.classList.add('text-error');
                }
            }
        }, 1000);
    </script>
