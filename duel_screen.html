<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .tactile-button {
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .tactile-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 rgba(0,0,0,0.2);
        }

        .tile-pop {
            animation: tilePop 0.15s ease-out;
        }
        @keyframes tilePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .adventure-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at center, #ffffff 0%, #f0f4ff 100%);
            overflow: hidden;
        }

        .dust-particle {
            position: absolute;
            background: rgba(69, 30, 187, 0.05);
            border-radius: 50%;
            filter: blur(1px);
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 0.3; }
            100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
        }

        .tile-correct-style {
            background: linear-gradient(180deg, #7cc476 0%, #6AAA64 100%);
            color: white;
            border-bottom: 4px solid #538d4e;
        }
        .tile-present-style {
            background: linear-gradient(180deg, #d8c56e 0%, #C9B458 100%);
            color: white;
            border-bottom: 4px solid #b59f3b;
        }
        .tile-empty-style {
            background-color: white;
            border: 2px solid #e2e8f0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
    </style>

<script>
    // Timer Logic
    let seconds = 90;
    const timerEl = document.getElementById('game-timer');
    const timerBox = document.getElementById('timer-box');
    const pointsEl = document.getElementById('potential-points');
    let potentialPoints = 2000;

    const timerInterval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
            clearInterval(timerInterval);
            seconds = 0;
        }

        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        // Score decay simulation
        potentialPoints = Math.max(500, potentialPoints - 2);
        pointsEl.textContent = potentialPoints;

        // Urgent state visual feedback
        if (seconds < 15) {
            timerBox.classList.remove('bg-tertiary-container');
            timerBox.classList.add('bg-error-container', 'text-on-error-container', 'animate-pulse');
        }
    }, 1000);

    // Particle background logic
    const dustLayer = document.getElementById('dust-layer');
    for(let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.className = 'dust-particle';
        const size = Math.random() * 6 + 3;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animation = `float ${Math.random() * 10 + 10}s linear infinite`;
        particle.style.opacity = Math.random() * 0.4;
        dustLayer.appendChild(particle);
    }
</script>
